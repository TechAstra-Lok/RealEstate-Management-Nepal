<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: auto; }
        .item { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; background-color: #f9f9f9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dashboard</h1>
        {% if items %}
            {% for item in items %}
                <div class="item">
                    <h3>{{ item.title }}</h3>
                    <p>{{ item.content }}</p>
                    <small>Created on: {{ item.created_at }}</small>
                </div>
            {% endfor %}
        {% else %}
            <p>No items available.</p>
        {% endif %}
        <a href="{% url 'dashboard' %}">Refresh</a>
    </div>
</body>
</html>
