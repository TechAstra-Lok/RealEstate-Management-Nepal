<!-- Login Modal -->
<div class="modal fade" id="loginModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
          <div class="modal-header">
              <h5 class="modal-title">Login</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
              <form id="loginForm" method="POST">
                  {% csrf_token %}
                  <div class="mb-3">
                      <label for="loginEmail" class="form-label">Email</label>
                      <input type="email" id="loginEmail" name="email" class="form-control" required placeholder="Enter your email" />
                  </div>
                  <div class="mb-3">
                      <label for="loginPassword" class="form-label">Password</label>
                      <input type="password" id="loginPassword" name="password" class="form-control" required placeholder="Enter your password" />
                  </div>
                  <button type="submit" class="btn btn-primary w-100">Login</button>
              </form>
              <div class="mt-3 text-center">
                  <p class="text-muted">Don't have an account? <button class="btn btn-link p-0" data-bs-dismiss="modal" data-bs-toggle="modal" data-bs-target="#registerModal">Sign Up</button></p>
              </div>
          </div>
      </div>
  </div>
</div>

<!-- Register Modal -->
<div class="modal fade" id="registerModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
          <div class="modal-header">
              <h5 class="modal-title">Create Account</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
              <form id="registerForm" method="POST">
                  {% csrf_token %}
                  <div class="mb-3">
                      <label for="fullName" class="form-label">Full Name</label>
                      <input type="text" id="fullName" name="fullName" class="form-control" required placeholder="Your full name" />
                  </div>
                  <div class="mb-3">
                      <label for="registerEmail" class="form-label">Email</label>
                      <input type="email" id="registerEmail" name="email" class="form-control" required placeholder="Your email address" />
                  </div>
                  <div class="mb-3">
                      <label for="registerPassword" class="form-label">Password</label>
                      <input type="password" id="registerPassword" name="password" class="form-control" required minlength="8" placeholder="Create a password" />
                  </div>
                  <div class="mb-3">
                      <label for="confirmPassword" class="form-label">Confirm Password</label>
                      <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required placeholder="Confirm your password" />
                  </div>
                  <button type="submit" class="btn btn-primary w-100">Register</button>
              </form>
          </div>
      </div>
  </div>
</div>

<!-- Script to handle modal behavior -->
<script>
  // Register Form Submission
  document.getElementById("registerForm").addEventListener("submit", function(event) {
      event.preventDefault();
      
      var formData = new FormData(this);

      fetch("{% url 'register' %}", {
          method: "POST",
          body: formData
      })
      .then(response => response.json())
      .then(data => {
          if (data.status === "success") {
              alert(data.message); // Display success message
              $('#registerModal').modal('hide');
              $('#loginModal').modal('show'); // Show login modal after successful registration
          } else {
              alert(data.message); // Display error message
          }
      })
      .catch(error => {
          console.error('Error:', error);
          alert('An error occurred. Please try again.');
      });
  });

  // Login Form Submission
  document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      var formData = new FormData(this);

      fetch("{% url 'login' %}", {
          method: "POST",
          body: formData
      })
      .then(response => response.json())
      .then(data => {
          if (data.status === "success") {
              alert(data.message); // Display success message
              window.location.href = "{% url 'dashboard' %}"; // Redirect to dashboard
          } else {
              alert(data.message); // Display error message
          }
      })
      .catch(error => {
          console.error('Error:', error);
          alert('An error occurred. Please try again.');
      });
  });
</script>
