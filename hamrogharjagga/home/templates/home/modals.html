{% load static %}
<!-- Login Modal -->
<div class="modal fade" id="loginModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Login</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="loginForm" method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label for="loginEmail" class="form-label">Email</label>
            <input type="email" id="loginEmail" name="email" class="form-control" required placeholder="Enter your email" />
          </div>
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <div class="input-group">
            <input type="password" class="password-field form-control" name="password2" required placeholder="Confirm your password" />
            <button type="button" class="btn btn-outline-primary toggle-password">
              <i class="bi bi-eye"></i> 
            </button>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <div class="mt-3 text-center">
          <button class="btn btn-link p-0" data-bs-dismiss="modal" data-bs-toggle="modal" data-bs-target="#registerModal">Sign Up</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Register Modal -->
<div class="modal fade" id="registerModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Create Account</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="registerForm" method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label for="fullName" class="form-label">Full Name</label>
            <input type="text" id="fullName" name="full_name" class="form-control" required placeholder="Your full name" />
          </div>
          <div class="mb-3">
            <label for="registerEmail" class="form-label">Email</label>
            <input type="email" id="registerEmail" name="email" class="form-control" required placeholder="Your email address" />
          </div>

          <div class="mb-3">
            <label for="registerPassword" class="form-label">Password</label>
            <div class="input-group">
              <input type="password" id="registerPassword" name="password1" class="form-control" required minlength="8" placeholder="Create a password" />
              <button type="button" class="btn btn-outline-primary toggle-password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <div class="input-group">
              <input type="password" id="confirmPassword" name="password2" class="form-control" required placeholder="Confirm your password" />
              <button type="button" class="btn btn-outline-primary toggle-password">
                <i class="bi bi-eye"></i> 
              </button>
            </div>
          </div>

          <div class="mb-3">
            <label for="phoneNumber" class="form-label">Phone Number</label>
            <input type="text" id="phoneNumber" name="phone_number" class="form-control" required placeholder="Your phone number" />
          </div>
          <div class="d-flex justify-content-between mb-3">
            <div>
              <label for="municipality" class="form-label">Municipality</label>
              <input type="text" id="municipality" name="municipality" class="form-control" required placeholder="Municipality" />
            </div>
            <div>
              <label for="district" class="form-label">District</label>
              <input type="text" id="district" name="district" class="form-control" required placeholder="District" />
            </div>
          </div>
          <div class="d-flex justify-content-between mb-3">
            <!-- Roles Selection -->
            <div class="d-flex flex-column align-items-start">
              <h5>Select Your Role</h5>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="role" id="buyer" value="buyer" required>
                <label class="form-check-label" for="buyer">Buyer</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="role" id="seller" value="seller" required>
                <label class="form-check-label" for="seller">Seller</label>
              </div>
            </div>
          
            <!-- Payment Selection -->
            <div class="d-flex flex-column align-items-start">
              <h5>Payment</h5>
              <div class="form-group">
                <select class="form-control" name="payment_method" required>
                  <option value="paypal">PayPal</option>
                  <option value="esewa">eSewa</option>
                </select>
              </div>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Sign Up</button>
        </form>
        <div class="mt-3 text-center">
          <button class="btn btn-link p-0" data-bs-dismiss="modal" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>      
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
  $(document).ready(function(){
    var csrfToken = $('input[name="csrfmiddlewaretoken"]').val();
    var registerUrl = "{% url 'home:register' %}";
    var loginUrl = "{% url 'home:login' %}";

    // Show login modal
    $("#loginBtn").click(function(){
      $("#registerModal").modal("hide");
      $("#loginModal").modal("show");
    });

    // Show register modal
    $("#registerBtn").click(function(){
      $("#loginModal").modal("hide");
      $("#registerModal").modal("show");
    });

    // Handle register form submission
    $("#registerForm").on("submit", function(event) {
      event.preventDefault();
      var formData = $(this).serialize();

      $.ajax({
        type: "POST",
        url: registerUrl,
        data: formData,
        success: function(response) {
          if (response.status === "success") {
            alert(response.message); // Display success message
            $("#registerModal").modal("hide");
            $("#loginModal").modal("show"); // Show login modal after successful registration
          } else {
            alert(response.message); // Display error message
          }
        },
        error: function(xhr, status, error) {
          console.error("Error:", error);
          alert("An error occurred. Please try again.");
        }
      });
    });

    
    // Handle login form submission 
    $("#loginForm").on("submit", function(event) {
      event.preventDefault();
      var formData = $(this).serialize();
        
      console.log('formData:', formData);

      $.ajax({
        type: "POST",
        url: loginUrl,
        data: formData,
        success: function(response) {
          if (response.status === "success") {
            alert(response.message); // Display success message
            window.location.reload(); // Reload the page after successful login
          } else {
            alert(response.message); // Display error message
          }
        },
        error: function(xhr, status, error) {
          console.error("Error:", error);
          alert("An error occurred. Please try again.");
        }
      });
    });

    // Toggle password visibility for all password fields
    document.querySelectorAll('.toggle-password').forEach(function(button) {
      button.addEventListener('click', function() {
        const passwordField = this.previousElementSibling;
        const icon = this.querySelector('i');
        
        if (passwordField.type === 'password') {
          passwordField.type = 'text';
          icon.classList.remove('bi-eye');
          icon.classList.add('bi-eye-slash');
        } else {
          passwordField.type = 'password';
          icon.classList.remove('bi-eye-slash');
          icon.classList.add('bi-eye');
        }
      });
    });
  });
</script>
