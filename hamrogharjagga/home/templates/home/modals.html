{% load static %}
<!-- Login Modal -->
<div class="modal fade" id="loginModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
      <div class="modal-header bg-primary text-white p-4">
        <div>
          <h5 class="modal-title fw-bold mb-1"><i class="fas fa-lock me-2"></i> Welcome Back</h5>
          <small class="opacity-75">Sign in to your HamroGharJagga account</small>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <form id="loginForm" method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label for="loginEmail" class="form-label small fw-bold text-muted">Email Address</label>
            <input type="email" id="loginEmail" name="email" class="form-control form-control-lg search-form-control" required placeholder="name@example.com" />
          </div>
          <div class="mb-3">
            <label for="loginPassword" class="form-label small fw-bold text-muted">Password</label>
            <div class="input-group">
              <input type="password" id="loginPassword" class="password-field form-control form-control-lg search-form-control" name="password2" required placeholder="Enter password" />
              <button type="button" class="btn btn-outline-secondary toggle-password">
                <i class="bi bi-eye"></i> 
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fs-6 fw-semibold mt-2" id="loginSubmitBtn">
            <i class="fas fa-sign-in-alt me-1"></i> Sign In
          </button>
        </form>
        <div class="mt-4 pt-3 border-top text-center small text-muted">
          Don't have an account? 
          <button class="btn btn-link text-primary fw-bold p-0 text-decoration-none" data-bs-dismiss="modal" data-bs-toggle="modal" data-bs-target="#registerModal">
            Create Account
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Register Modal -->
<div class="modal fade" id="registerModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
      <div class="modal-header bg-primary text-white p-4">
        <div>
          <h5 class="modal-title fw-bold mb-1"><i class="fas fa-user-plus me-2"></i> Join HamroGharJagga</h5>
          <small class="opacity-75">Buy, sell, or invest in verified Nepal properties</small>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <form id="registerForm" method="POST">
          {% csrf_token %}
          
          <div class="row g-3">
            <div class="col-md-6">
              <label for="fullName" class="form-label small fw-bold text-muted">Full Legal Name *</label>
              <input type="text" id="fullName" name="full_name" class="form-control search-form-control" required placeholder="e.g. Lokesh Prasai" />
            </div>
            <div class="col-md-6">
              <label for="registerEmail" class="form-label small fw-bold text-muted">Email Address *</label>
              <input type="email" id="registerEmail" name="email" class="form-control search-form-control" required placeholder="name@example.com" />
            </div>

            <div class="col-md-6">
              <label for="registerPassword" class="form-label small fw-bold text-muted">Password (min 8 chars) *</label>
              <div class="input-group">
                <input type="password" id="registerPassword" name="password1" class="form-control search-form-control" required minlength="8" placeholder="Create password" />
                <button type="button" class="btn btn-outline-secondary toggle-password">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
            <div class="col-md-6">
              <label for="confirmPassword" class="form-label small fw-bold text-muted">Confirm Password *</label>
              <div class="input-group">
                <input type="password" id="confirmPassword" name="password2" class="form-control search-form-control" required placeholder="Confirm password" />
                <button type="button" class="btn btn-outline-secondary toggle-password">
                  <i class="bi bi-eye"></i> 
                </button>
              </div>
            </div>

            <div class="col-md-4">
              <label for="phoneNumber" class="form-label small fw-bold text-muted">Phone Number *</label>
              <input type="text" id="phoneNumber" name="phone_number" class="form-control search-form-control" required placeholder="98XXXXXXXX" />
            </div>
            <div class="col-md-4">
              <label for="district" class="form-label small fw-bold text-muted">District *</label>
              <input type="text" id="district" name="district" class="form-control search-form-control" required placeholder="Kathmandu" />
            </div>
            <div class="col-md-4">
              <label for="municipality" class="form-label small fw-bold text-muted">Municipality *</label>
              <input type="text" id="municipality" name="municipality" class="form-control search-form-control" required placeholder="Budhanilkantha" />
            </div>

            <!-- Role Selector -->
            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted d-block">I Want To</label>
              <div class="d-flex gap-3">
                <div class="form-check p-3 border rounded-3 flex-grow-1">
                  <input class="form-check-input" type="radio" name="role" id="buyer" value="buyer" checked required>
                  <label class="form-check-label fw-bold" for="buyer">
                    <i class="fas fa-shopping-bag text-primary me-1"></i> Buy / Search Land
                  </label>
                </div>
                <div class="form-check p-3 border rounded-3 flex-grow-1">
                  <input class="form-check-input" type="radio" name="role" id="seller" value="seller" required>
                  <label class="form-check-label fw-bold" for="seller">
                    <i class="fas fa-bullhorn text-success me-1"></i> Sell / List Plots
                  </label>
                </div>
              </div>
            </div>

            <!-- Payment Method -->
            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Preferred Payment Service</label>
              <select class="form-select search-form-control" name="payment_method" required>
                <option value="esewa">eSewa Nepal</option>
                <option value="khalti">Khalti Digital Wallet</option>
                <option value="paypal">Bank Transfer / ConnectIPS</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fs-6 fw-semibold mt-4" id="registerSubmitBtn">
            <i class="fas fa-check-circle me-1"></i> Complete Registration
          </button>
        </form>

        <div class="mt-3 text-center small text-muted">
          Already have an account? 
          <button class="btn btn-link text-primary fw-bold p-0 text-decoration-none" data-bs-dismiss="modal" data-bs-toggle="modal" data-bs-target="#loginModal">
            Log In
          </button>      
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  $(document).ready(function(){
    var registerUrl = "{% url 'home:register' %}";
    var loginUrl = "{% url 'home:login' %}";

    // Handle register form submission
    $("#registerForm").on("submit", function(event) {
      event.preventDefault();
      var formData = $(this).serialize();
      var submitBtn = $("#registerSubmitBtn");
      submitBtn.prop("disabled", true).html('<span class="spinner-border spinner-border-sm me-2"></span> Registering...');

      $.ajax({
        type: "POST",
        url: registerUrl,
        data: formData,
        success: function(response) {
          if (response.status === "success") {
            Swal.fire({
              icon: 'success',
              title: 'Account Created!',
              text: response.message || 'You can now sign in with your credentials.'
            }).then(() => {
              $("#registerModal").modal("hide");
              $("#loginModal").modal("show");
            });
          } else {
            Swal.fire({
              icon: 'error',
              title: 'Registration Error',
              text: response.message || 'Please check your inputs and try again.'
            });
          }
        },
        error: function(xhr, status, error) {
          Swal.fire({
            icon: 'error',
            title: 'System Error',
            text: 'An error occurred during registration. Please try again.'
          });
        },
        complete: function() {
          submitBtn.prop("disabled", false).html('<i class="fas fa-check-circle me-1"></i> Complete Registration');
        }
      });
    });

    // Handle login form submission 
    $("#loginForm").on("submit", function(event) {
      event.preventDefault();
      var formData = $(this).serialize();
      var submitBtn = $("#loginSubmitBtn");
      submitBtn.prop("disabled", true).html('<span class="spinner-border spinner-border-sm me-2"></span> Signing in...');

      $.ajax({
        type: "POST",
        url: loginUrl,
        data: formData,
        success: function(response) {
          if (response.status === "success") {
            Swal.fire({
              icon: 'success',
              title: 'Welcome Back!',
              text: response.message || 'Successfully signed in.',
              timer: 1500,
              showConfirmButton: false
            }).then(() => {
              if (response.redirect_url) {
                window.location.href = response.redirect_url;
              } else {
                window.location.reload();
              }
            });
          } else {
            Swal.fire({
              icon: 'error',
              title: 'Sign In Failed',
              text: response.message || 'Invalid credentials.'
            });
          }
        },
        error: function(xhr, status, error) {
          Swal.fire({
            icon: 'error',
            title: 'System Error',
            text: 'An error occurred during login. Please try again.'
          });
        },
        complete: function() {
          submitBtn.prop("disabled", false).html('<i class="fas fa-sign-in-alt me-1"></i> Sign In');
        }
      });
    });

    // Toggle password visibility
    document.querySelectorAll('.toggle-password').forEach(function(button) {
      button.addEventListener('click', function() {
        const passwordField = this.previousElementSibling;
        const icon = this.querySelector('i');
        
        if (passwordField.type === 'password') {
          passwordField.type = 'text';
          icon.classList.remove('bi-eye');
          icon.classList.add('bi-eye-slash');
        } else {
          passwordField.type = 'password';
          icon.classList.remove('bi-eye-slash');
          icon.classList.add('bi-eye');
        }
      });
    });
  });
</script>
